name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: deps · lint · typecheck · test
    # pinned: windows-latest (2025 image) ships VS2026, which the node-gyp
    # bundled with pnpm cannot detect (VS-finder maxbuffer crash) — breaks the
    # print-agent-spooler-raw addon build. Revisit when pnpm bundles a
    # VS2026-aware node-gyp.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency admission (CLAUDE.md rule 10)
        run: node scripts/check-deps.mjs
      - name: SBOM (CycloneDX, uploaded per run)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0 (supply-chain: SHA-pinned)
        with:
          format: cyclonedx-json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  smoke:
    name: build · fuses · no-listen (AC-4)
    needs: gate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm fuse:dev
      - run: pnpm no-listen
